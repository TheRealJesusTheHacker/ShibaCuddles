name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  build-windows:
    name: Build Windows .exe
    runs-on: windows-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build with PyInstaller
        run: pyinstaller --noconfirm shibacuddles.spec
      - name: Generate SHA256 hashes
        shell: pwsh
        run: |
          cd dist
          Get-ChildItem *.exe | ForEach-Object { "{0}  {1}" -f (Get-FileHash $_.FullName -Algorithm SHA256).Hash, $_.Name } | Out-File -Encoding ascii SHA256SUMS-windows.txt
          Get-Content SHA256SUMS-windows.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4
        with:
          subject-path: |
            dist/*.exe
            dist/SHA256SUMS-windows.txt
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/*.exe
            dist/SHA256SUMS-windows.txt
          generate_release_notes: true

  build-linux:
    name: Build Linux binary
    runs-on: ubuntu-latest
    permissions:
      contents: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          pip install -r requirements.txt
          pip install pyinstaller
      - name: Build with PyInstaller
        run: pyinstaller --noconfirm shibacuddles.spec
      - name: Generate SHA256 hashes
        run: |
          cd dist
          sha256sum ShibaCuddles > SHA256SUMS-linux.txt
          cat SHA256SUMS-linux.txt
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4
        with:
          subject-path: |
            dist/ShibaCuddles
            dist/SHA256SUMS-linux.txt
      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          files: |
            dist/ShibaCuddles
            dist/SHA256SUMS-linux.txt
